spring.application.name=Urlshort

# 서버 포트
server.port=8080

# 데이터베이스 연결 주소 (HeidiSQL에서 만든 url_db로 매칭)
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://localhost:3306/url_db

# MariaDB 아이디와 비밀번호 (HeidiSQL 로그인할 때 쓰신 비밀번호)
spring.datasource.username=root
spring.datasource.password=040530

# JPA (데이터베이스 자동 테이블 생성) 설정
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true